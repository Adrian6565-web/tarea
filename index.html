<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Formulario Personal</title>

    <link rel="stylesheet" href="estilos.css">

    <script src="funciones.js"></script>
</head>

<h2>Registro de Datos del Usuario</h2>

<section class="formulario">

    <input type="text" id="txtNombre" placeholder="Nombre completo">

    <input type="date" id="txtFecha">

    <input type="text" id="txtSangre" placeholder="Tipo de sangre">

    <input type="number" id="txtAltura" placeholder="Altura en pulgadas">

    <input type="number" id="txtPeso" placeholder="Peso en kilogramos">

    <select id="txtGenero">
        <option value="">Seleccione género</option>
        <option value="F">Femenino</option>
        <option value="M">Masculino</option>
    </select>

    <button onclick="calcular()">Mostrar información</button>
    <div id="resultadoFinal"></div>
</section>

</html>
